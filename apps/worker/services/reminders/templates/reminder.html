<!DOCTYPE html>
<html>
  <body style="margin: 0; padding: 24px; background-color: #f4f4f4; font-family: -apple-system, sans-serif;">
    <table role="presentation" width="100%" style="max-width: 480px; margin: 0 auto; background-color: #ffffff; border: 1px solid #e0e0e0; border-radius: 8px;">
      <tr>
        <td style="padding: 32px;">
          <p style="margin: 0 0 24px 0; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; color: #16161d; text-transform: uppercase;">
            Duely
          </p>

          <p style="margin: 0 0 20px 0; font-size: 14px; color: #555555;">
            Here's a heads-up about an upcoming deadline:
          </p>

          <p style="margin: 0 0 6px 0; font-size: 19px; font-weight: 600; color: #16161d;">
            {{ title }}
          </p>

          <p style="margin: 0 0 24px 0; font-size: 14px; color: #555555;">
            This is due on {{ due_date_formatted }}.
          </p>

          <a href="{{ app_url }}" style="display: inline-block; padding: 11px 22px; background-color: #16161d; color: #ffffff; text-decoration: none; font-size: 14px; font-weight: 500; border-radius: 6px;">Open in Duely</a>

          <p style="margin: 32px 0 0 0; font-size: 12px; line-height: 1.5; color: #999999;">
            You're getting this because you set a reminder for this deadline in Duely. If you weren't expecting it, you can safely ignore this email.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
